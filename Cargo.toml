[package]
name = "jcli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
url = "2.5.8"

[dev-dependencies]
httpmock = "0.8.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
