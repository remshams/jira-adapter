[package]
name = "jcli"
version = "0.1.0"
edition = "2024"

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.183"
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
url = "2.5.8"

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3.27.0"
